name: backend

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gsm
          POSTGRES_PASSWORD: gsm
          POSTGRES_DB: gsm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gsm" --health-interval 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      GSM_DATABASE_URL: postgresql+psycopg://gsm:gsm@localhost:5432/gsm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - name: migrations match models
        run: alembic upgrade head && alembic check
      - run: pytest -q
