services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gsm
      POSTGRES_PASSWORD: gsm
      POSTGRES_DB: gsm
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsm"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    environment: &env
      GSM_DATABASE_URL: postgresql+psycopg://gsm:gsm@db:5432/gsm
      GSM_STORAGE_DIR: /data/storage
      GSM_AUTH_MODE: dev
      GSM_DIDOX_MODE: fake
    volumes: [storage:/data/storage]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}

  # Фоновая сверка с Didox. Масштабируется: docker compose up --scale worker=3
  worker:
    build: ./backend
    command: python -m app.worker
    environment: *env
    volumes: [storage:/data/storage]
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
  storage:
